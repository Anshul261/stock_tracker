<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171719">
  <meta name="description" content="Still: a private, tabbed investment research workspace. Synthetic-data prototype.">
  <title>Still — Investment workspace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171719'/%3E%3Cpath d='M9 20V12m7 12V8m7 12V12' stroke='%23ddd' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#workspace-panel">Skip to workspace</a>
  <div class="app" id="app" data-tab="portfolio">
    <nav class="rail" aria-label="Workspace navigation">
      <a href="#portfolio" class="rail-brand" aria-label="Still home"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 20V12m7 12V8m7 12V12"/></svg></a>
      <div class="rail-main"><button class="rail-button" data-go="portfolio" aria-label="Portfolio" title="Portfolio · 1"><span data-icon="portfolio"></span><span class="rail-label">Portfolio</span></button><button class="rail-button" data-go="discover" aria-label="Discover" title="Discover · 2"><span data-icon="discover"></span><span class="rail-label">Discover</span></button><button class="rail-button" data-go="research" aria-label="Research" title="Research · 3"><span data-icon="research"></span><span class="rail-label">Research</span></button><button class="rail-button" data-go="news" aria-label="News" title="News · 4"><span data-icon="news"></span><span class="rail-label">News</span></button></div>
      <button class="rail-button rail-utility" data-go="settings" aria-label="Settings" title="Settings"><span data-icon="shield"></span><span class="rail-label">Settings</span></button>
    </nav>
    <div class="workspace-shell">
      <header class="global-header"><a class="wordmark" href="#portfolio">still<span>.</span></a><span class="header-divider"></span><span class="workspace-name">Personal workspace</span><div class="global-search-wrap"><label class="global-search"><span data-icon="search"></span><input id="global-search" type="search" placeholder="Find a stock or go to…" aria-label="Search stocks and pages" role="combobox" aria-autocomplete="list" aria-controls="global-results" aria-expanded="false" autocomplete="off"><kbd>Ctrl K</kbd></label><div id="global-results" class="search-results" role="listbox" aria-label="Search results" hidden></div></div><span class="demo-status"><span></span>Synthetic data</span><button class="account-button" data-go="settings" aria-label="Workspace settings">A</button></header>
      <div class="tabbar"><div class="document-tabs" id="document-tabs" role="tablist" aria-label="Open workspace tabs"></div><div class="tabbar-actions"><button id="new-tab" class="icon-button" aria-label="Find a stock to open in a new tab" title="Open stock tab"><span data-icon="plus"></span></button><button id="toggle-list" class="icon-button" aria-label="Hide instrument list" title="Toggle instrument list" aria-expanded="true"><span data-icon="panel"></span></button></div></div>
      <div class="workspace-grid" id="workspace-grid">
        <section class="instrument-browser" id="instrument-browser" aria-label="Instrument browser">
          <div class="browser-heading"><h2 id="browser-title">Your instruments</h2><span id="browser-count">8</span></div>
          <label class="browser-search"><span data-icon="search"></span><input id="instrument-search" placeholder="Search holdings…" aria-label="Search instrument list" type="search" autocomplete="off"><kbd>/</kbd></label>
          <div id="browser-controls"></div>
          <div id="instrument-list" class="instrument-list"></div>
          <div class="browser-footer"><div class="browser-total" id="browser-total"></div><form id="quick-question" class="quick-question"><label for="quick-question-input">Ask about your portfolio</label><div class="question-input"><input id="quick-question-input" placeholder="e.g. semiconductor exposure" autocomplete="off"><button type="submit" class="icon-button" aria-label="Open research for your question"><span data-icon="send"></span></button></div></form><p>Demo snapshot · 21 Oct 2026</p></div>
        </section>
        <div class="splitter" id="splitter" role="separator" tabindex="0" aria-label="Resize instrument list" aria-orientation="vertical" aria-valuemin="240" aria-valuemax="440" aria-valuenow="300"><span></span></div>
        <main class="canvas" id="workspace-panel" role="tabpanel" tabindex="-1" aria-label="Portfolio workspace"><div id="canvas-content"></div></main>
      </div>
      <footer class="statusbar"><span><span class="connection-dot"></span>Demo workspace <span class="status-separator">/</span> No broker connected</span><span>USD <span class="status-separator">·</span> Calculations run locally</span><span class="status-help">Search <kbd>Ctrl K</kbd> <span class="status-separator">·</span> Switch tabs <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span></footer>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This interactive synthetic-data prototype needs JavaScript. It never connects to your broker.</p></noscript>
  <script src="data.js"></script><script src="assets/charts.js"></script><script src="news-sources.js"></script><script src="news.js"></script><script src="app.js"></script>
</body>
</html>
